name: Distribute release

# Also used when a maintainer completes a release with a locally built binary.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to distribute to Homebrew and GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Download formula assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir dist --pattern 'tavern-darwin-*.gz' --pattern 'tavern-linux-arm64.gz' --pattern 'tavern-linux-x64.gz'
      - name: Homebrew formula
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:piepiaspace/homebrew-tavern.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          bun release/targets.ts brew "$RELEASE_TAG" dist > "$RUNNER_TEMP/tap/Formula/tavern.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tavern.rb
          git diff --cached --quiet && exit 0
          git commit -m "tavern $RELEASE_TAG"
          git push

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Download image binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir dist --pattern 'tavern-linux-arm64.gz' --pattern 'tavern-linux-x64.gz'
      - name: Stage the Linux binaries by Docker's architecture names
        run: |
          mkdir -p dist/docker/amd64 dist/docker/arm64
          gzip -dc dist/tavern-linux-x64.gz > dist/docker/amd64/tavern
          gzip -dc dist/tavern-linux-arm64.gz > dist/docker/arm64/tavern
          chmod 755 dist/docker/*/tavern
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: dist
          file: release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/piepiaspace/effect-tavern:${{ inputs.tag }}
            ghcr.io/piepiaspace/effect-tavern:latest
