name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One build, every channel. release/targets.ts is the table: every binary, the runner that builds it and its asset
# name (stamped into it, so `tavern update` fetches its own build). All of them build at once, one job each; the
# release, the Homebrew formula and the image start when the last one lands. Script installs (install.sh, install.ps1)
# and `tavern update` read the GitHub release; Homebrew and the image carry the same binaries. The formula goes to
# piepiaspace/homebrew-tavern through a deploy key (secret HOMEBREW_TAP_KEY); the image to ghcr.io with the
# workflow's own token. A run by hand (workflow_dispatch) builds everything and publishes nothing.
jobs:
  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: targets
        run: echo "matrix=$(bun release/targets.ts matrix)" >> "$GITHUB_OUTPUT"

  # install.sh against a local mirror with simulated machines, and the table against the installers; beside the build
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test/install.ts && bun test/release.ts

  build:
    needs: plan
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the page
        working-directory: packages/client
        run: bun --bun vp build
      # `tavern --version` answers the tag without its v (a run by hand: dev)
      - name: Compile
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION="${GITHUB_REF_NAME#v}"
          bun release/targets.ts compile "${{ matrix.asset }}"
      - name: Check the packaged version on its native runner
        if: startsWith(matrix.asset, 'tavern-darwin-') || matrix.asset == 'tavern-linux-x64'
        run: |
          expected=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then expected=${GITHUB_REF_NAME#v}; fi
          gzip -dc "packages/server/dist/${{ matrix.asset }}.gz" > "$RUNNER_TEMP/tavern"
          chmod +x "$RUNNER_TEMP/tavern"
          actual=$("$RUNNER_TEMP/tavern" --version)
          echo "$actual"
          test "$actual" = "tavern $expected"
      # the .gz alone; already compressed, so the artifact stores it as it is
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: packages/server/dist/${{ matrix.asset }}.gz
          compression-level: 0
          retention-days: 7

  publish:
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # release.txt: the tag, then the feat/fix/perf subjects since the previous tag; it is the release's notes, where
      # the installers read the tag, and what `tavern update` shows before it asks
      - name: Notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "$GITHUB_REF_NAME"
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_SHA" | grep -E '^- (feat|fix|perf)' || echo '- (no user-facing changes)'
          } > dist/release.txt
          cat dist/release.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n +2 dist/release.txt > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.gz dist/release.txt install.sh install.ps1 --notes-file notes.md

  distribute:
    needs: publish
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
