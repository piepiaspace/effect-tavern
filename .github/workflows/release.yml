name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# One build, every channel. release/targets.ts is the table: every binary, the runner that builds it and its asset
# name (stamped into it, so `tavern update` fetches its own build). All of them build at once, one job each (the two macOS ones share a mac); the
# release, the Homebrew formula and the image start when the last one lands. Script installs (install.sh, install.ps1)
# and `tavern update` read the GitHub release; Homebrew and the image carry the same binaries. The formula goes to
# piepiaspace/homebrew-tavern through a deploy key (secret HOMEBREW_TAP_KEY); the image to ghcr.io with the
# workflow's own token. The standalone app (packages/app, MyGo) builds beside them, one job per platform, into the same
# release: its installers, and the signed archives and update-<platform>.json its updater reads from the latest
# release (mygo.json updates). A run by hand (workflow_dispatch) builds everything and publishes nothing.
jobs:
  plan:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - id: targets
        run: echo "matrix=$(bun release/targets.ts matrix)" >> "$GITHUB_OUTPUT"

  # install.sh against a local mirror with simulated machines, the table against the installers, and the app's own checks
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/app/go.mod
          cache-dependency-path: packages/app/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun test/install.ts && bun test/release.ts && (cd packages/app && bun run verify)

  build:
    needs: plan
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Build the page
        working-directory: packages/client
        run: bun --bun vp build
      # `tavern --version` answers the tag without its v (a run by hand: dev)
      - name: Compile
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION="${GITHUB_REF_NAME#v}"
          bun release/targets.ts compile ${{ matrix.assets }}
      - name: Check the packaged version on its native runner
        if: matrix.name == 'tavern-darwin' || matrix.name == 'tavern-linux-x64'
        run: |
          expected=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then expected=${GITHUB_REF_NAME#v}; fi
          for asset in ${{ matrix.assets }}; do
            gzip -dc "packages/server/dist/$asset.gz" > "$RUNNER_TEMP/tavern"
            chmod +x "$RUNNER_TEMP/tavern"
            actual=$("$RUNNER_TEMP/tavern" --version)
            echo "$asset: $actual"
            test "$actual" = "tavern $expected"
          done
      # the .gz alone; already compressed, so the artifact stores it as it is
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: packages/server/dist/*.gz
          compression-level: 0
          retention-days: 7

  # The app, after MyGo's docs/github-actions.md: Go needs no cgo on desktops, so only the Mac needs a mac. Unsigned:
  # macOS ad hoc, Windows not at all. Its version is the tag's; its update notes the release's (CHANGELOG.md). Secrets:
  # MYGO_UPDATER_PRIVATE_KEY signs updates, ANDROID_KEYSTORE (base64) and ANDROID_KEYSTORE_PASSWORD the APK.
  app:
    name: app ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: blacksmith-6vcpu-macos-latest, platform: darwin/universal }
          # one row per Windows CPU: each installer is ~9 s of NSIS
          - { name: windows-x64, runner: blacksmith-2vcpu-ubuntu-2604, platform: windows/amd64 }
          - { name: windows-arm64, runner: blacksmith-2vcpu-ubuntu-2604, platform: windows/arm64 }
          - { name: linux, runner: blacksmith-2vcpu-ubuntu-2604, platform: "linux/amd64,linux/arm64" }
          - { name: android, runner: blacksmith-2vcpu-ubuntu-2604, platform: android/arm64 }
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/app/go.mod
          cache-dependency-path: packages/app/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # web/build.ts runs vp in packages/client
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      # the image has no apt lists, so installing NSIS means refreshing them first (7 s); keep its .debs instead
      - if: startsWith(matrix.name, 'windows')
        id: nsis
        uses: actions/cache@v6
        with:
          path: ~/nsis-debs
          key: nsis-debs-${{ matrix.runner }}
      - name: NSIS, for the Windows installers
        if: startsWith(matrix.name, 'windows')
        run: |
          if [ "${{ steps.nsis.outputs.cache-hit }}" != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends --download-only nsis
            mkdir -p ~/nsis-debs && cp /var/cache/apt/archives/*.deb ~/nsis-debs/
          fi
          sudo dpkg -i ~/nsis-debs/*.deb || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nsis)
      - if: matrix.name == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # the image carries an Android SDK; add only what it lacks (mygo takes the newest NDK there)
      - name: Android SDK
        if: matrix.name == 'android'
        run: |
          sdk=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          need=
          [ -d "$sdk/platforms/android-36" ] || need="$need platforms;android-36"
          ls -d "$sdk"/ndk/*/ > /dev/null 2>&1 || need="$need ndk;28.2.13676358"
          if [ -n "$need" ]; then yes | sudo "$sdk/cmdline-tools/latest/bin/sdkmanager" $need > /dev/null; fi
          ls "$sdk/platforms" "$sdk/ndk" "$sdk/build-tools"
      # mygo's Gradle project on an empty Gradle home downloads Gradle and ~1 GB of the Android plugin and its
      # dependencies: 2m36s cold against 7.5s warm. setup-gradle keeps that home between runs (written from main).
      - if: matrix.name == 'android'
        uses: gradle/actions/setup-gradle@v6
      - name: The upload key
        if: matrix.name == 'android'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are required for tag releases" >&2
              exit 1
            fi
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > upload.jks
          else
            jq 'del(.android.keystore, .android.keyAlias)' mygo.json > mygo.json.new && mv mygo.json.new mygo.json
          fi
      - name: Version and notes
        if: github.ref_type == 'tag'
        run: |
          version=${GITHUB_REF_NAME#v}
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.new && mv mygo.json.new mygo.json
          { echo "## $version"; echo; sh ../../release/notes.sh "$GITHUB_SHA"; } > CHANGELOG.md
      # Its install scripts and SHA256SUMS stay behind: install.sh and install.ps1 are the tavern command's names.
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          go tool mygo build -platform "${{ matrix.platform }}"
          mkdir -p "$RUNNER_TEMP/app"
          cd build
          cp */*.dmg */*-setup-*.exe */*.tar.gz */*.deb */*.apk */update-*.json "$RUNNER_TEMP/app/" 2>/dev/null || true
          cp */*.delta "$RUNNER_TEMP/app/" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/app"
          test -n "$(ls "$RUNNER_TEMP/app")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${{ matrix.name }}" != android ]; then
            ls "$RUNNER_TEMP/app"/update-*.json >/dev/null
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: ${{ runner.temp }}/app/*
          compression-level: 0
          retention-days: 7

  publish:
    needs: [test, build, app]
    if: github.ref_type == 'tag'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # release.txt: the tag, then the feat/fix/perf subjects since the previous tag; it is the release's notes, where
      # the installers read the tag, and what `tavern update` shows before it asks
      - name: Notes
        run: |
          { echo "$GITHUB_REF_NAME"; sh release/notes.sh "$GITHUB_SHA"; } > dist/release.txt
          cat dist/release.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n +2 dist/release.txt > notes.md
          # the app's own update files live in the one rolling release app-updates (updates.url in packages/app/mygo.json)
          mkdir updates
          for f in dist/effect-tavern-*.tar.gz dist/*.delta; do if [ -e "$f" ]; then mv "$f" updates/; fi; done
          cp dist/update-*.json updates/
          # the manifests stay here too for apps before 0.12, which read the latest v* release; drop the cp above and
          # move them once no install older than 0.12 is left
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 --notes-file notes.md
      # archives and deltas first, the manifests last, so an app never reads a manifest whose files are missing; then
      # keep the archives of the last 3 versions (the next build makes its deltas from them) and only this version's deltas
      - name: App updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-updates > /dev/null 2>&1 ||
            gh release create app-updates --prerelease --title "App updates" --notes "The app's self-update files. Download the app from the latest release."
          gh release upload app-updates updates/effect-tavern-* --clobber
          gh release upload app-updates updates/update-*.json --clobber
          current=${GITHUB_REF_NAME#v}
          gh release view app-updates --json assets -q '.assets[].name' > names
          keep=$(sed -n 's/^effect-tavern-\([0-9.]*\)-[a-z].*\.tar\.gz$/\1/p' names | sort -uV | tail -3)
          while read -r n; do
            case $n in
              *.delta) v=${n#*-to-}; v=${v%%-*}; [ "$v" = "$current" ] && continue ;;
              *.tar.gz) v=${n#effect-tavern-}; v=${v%%-*}; echo "$keep" | grep -qx "$v" && continue ;;
              *) continue ;;
            esac
            gh release delete-asset app-updates "$n" -y
          done < names

  distribute:
    needs: publish
    uses: ./.github/workflows/distribute.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
