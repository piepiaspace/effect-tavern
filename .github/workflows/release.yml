name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # install.sh against a local mirror, with a simulated Termux environment.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test the installer
        run: bun test/install.ts

  android:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the page
        working-directory: packages/client
        run: bun --bun vp build

      # bin/tavern.ts with the page inside; `tavern --version` answers the tag without its v
      - name: Compile for Android
        working-directory: packages/server
        run: |
          VERSION="${GITHUB_REF_NAME#v}" bun run compile:android
          gzip -9 -c dist/tavern-android > dist/tavern-android.gz

      # release.txt: the tag, then the feat/fix/perf subjects since the previous tag; it is the release's notes, where
      # install.sh reads the tag, and what `tavern update` shows before it asks
      - name: Notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "$GITHUB_REF_NAME"
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_SHA" | grep -E '^- (feat|fix|perf)' || echo '- (no user-facing changes)'
          } > release.txt
          cat release.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n +2 release.txt > notes.md
          gh release create "$GITHUB_REF_NAME" packages/server/dist/tavern-android.gz release.txt install.sh --notes-file notes.md
