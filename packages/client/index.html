<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151515" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("theme")
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme
          const metas = document.querySelectorAll('meta[name="theme-color"]')
          const color = Array.from(metas).find((meta) => meta.media.includes(theme)).content
          for (const meta of metas) meta.content = color
        }
      } catch {
        // Storage can be unavailable. The media queries follow the system.
      }
    </script>
    <title>effect-tavern</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
